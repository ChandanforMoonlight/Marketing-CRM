<!doctype html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="theme-color" content="#14223b"><title>Marketing CRM | Malik Polychem</title>
<style>
:root{font-family:Inter,system-ui,-apple-system,'Segoe UI',Arial,sans-serif;color:#213149;background:#f5f7fb;font-size:14px}*{box-sizing:border-box}body{margin:0}button,input,select,textarea{font:inherit}button{cursor:pointer}input,select,textarea{padding:11px;border:1px solid #d9e0eb;border-radius:9px;background:white;color:#263950;width:100%}button:disabled{opacity:.5;cursor:default}.hide{display:none!important}.btn{padding:11px 16px;border:1px solid #365dcf;border-radius:9px;background:#365dcf;color:white;font-weight:700}.btn-lite{background:#fff;color:#34557e;border:1px solid #d8e0ec;border-radius:9px;padding:10px 14px}.login{min-height:100vh;display:grid;place-items:center;background:linear-gradient(120deg,#14243e 0 42%,#f3f6fb 42%)}.login-card{background:white;padding:38px;border-radius:20px;width:min(435px,calc(100% - 26px));box-shadow:0 22px 65px #101b3330}.monogram{background:#365dcf;color:white;font-size:23px;font-weight:900;width:46px;height:46px;border-radius:12px;display:grid;place-items:center}.login h1{font-size:32px;letter-spacing:-1px;margin:25px 0 7px}.muted{color:#7c8aa0;font-size:12px;line-height:1.55}.login label{display:block;font-size:12px;font-weight:700;color:#53657c;margin-top:20px}.login input{margin-top:8px}.login .btn{width:100%;margin-top:24px}.error{color:#b83b4a;font-size:12px;min-height:18px;margin:10px 0}.layout{display:flex;min-height:100vh}.side{width:240px;position:fixed;inset:0 auto 0 0;background:#14233b;color:#aebed5;display:flex;flex-direction:column;padding:24px 14px}.brand{font-size:18px;color:#fff;font-weight:800;padding:7px 9px 30px}.brand small{display:block;font-size:11px;font-weight:400;color:#95abc8;margin-top:6px}.nav button{display:block;width:100%;text-align:left;border:0;border-radius:9px;background:transparent;color:#b4c3d9;padding:12px 14px;margin:2px 0;font-weight:600}.nav button.active,.nav button:hover{background:#355182;color:white}.account{margin-top:auto;padding:17px 8px;border-top:1px solid #ffffff20;word-wrap:break-word;font-size:12px}.account button{width:100%;margin-top:12px;background:transparent;border:1px solid #61738b;color:white;border-radius:8px;padding:9px}.work{margin-left:240px;flex:1;min-width:0}.top{height:78px;background:#fff;border-bottom:1px solid #e3e8f0;display:flex;align-items:center;justify-content:space-between;padding:0 33px}.top h2{font-size:22px;margin:0}.main{padding:30px;max-width:1500px;margin:auto}.main h1{font-size:26px;letter-spacing:-.9px;margin:0 0 8px}.metrics{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:15px;margin:25px 0}.metric,.box{background:white;border:1px solid #e5eaf2;border-radius:14px;box-shadow:0 5px 19px #243c6410}.metric{padding:24px}.metric strong{font-size:31px;display:block;margin-top:12px;letter-spacing:-1px}.metric small{color:#71839c;font-weight:700}.bar{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:18px 0}.bar input{max-width:420px}.box{overflow:hidden}table{width:100%;border-collapse:collapse;min-width:800px}th,td{padding:13px 16px;text-align:left;border-bottom:1px solid #eef1f6;max-width:290px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:12px}th{font-size:11px;text-transform:uppercase;letter-spacing:.5px;background:#f8fafc;color:#74849b}td{color:#3f536f}td button{background:none;border:0;color:#315fc9;font-weight:700}tr:hover td{background:#fafbff}.overflow{overflow-x:auto}.foot{display:flex;justify-content:space-between;align-items:center;padding:16px}.foot button{margin-left:6px}.panel{background:white;border:1px solid #e6ebf2;border-radius:14px;padding:24px;margin-top:22px}.notice{padding:15px;border:1px solid #dce6ff;background:#f0f5ff;border-radius:10px;color:#49618d}.overlay{position:fixed;inset:0;background:#0b1939a8;display:grid;place-items:center;padding:16px;z-index:20}.modal{background:white;padding:27px;border-radius:16px;width:min(640px,100%);max-height:90vh;overflow:auto}.modal-head{display:flex;justify-content:space-between;align-items:center}.modal-head h3{font-size:20px}.fields{display:grid;grid-template-columns:1fr 1fr;gap:17px}.fields label{font-size:12px;color:#506079;font-weight:700}.fields label input,.fields label textarea,.fields label select{margin-top:6px}.fields textarea{min-height:90px}.wide{grid-column:1/-1}.actions{display:flex;justify-content:flex-end;gap:9px;margin-top:24px}.badge{background:#e9effe;color:#385ec5;border-radius:7px;padding:4px 8px;font-weight:700}.toast{position:fixed;bottom:25px;right:25px;background:#1b3353;color:white;padding:14px;border-radius:10px;z-index:40}.mobile-nav{display:none}@media(max-width:950px){.metrics{grid-template-columns:repeat(2,1fr)}}@media(max-width:700px){.side{display:none}.work{margin-left:0}.top{padding:0 14px}.main{padding:20px 12px}.metric{padding:15px}.metric strong{font-size:25px}.fields{grid-template-columns:1fr}.mobile-nav{display:flex;overflow-x:auto;gap:6px;padding:9px;background:#fff;border-bottom:1px solid #e5eaf2}.mobile-nav button{white-space:nowrap;border:0;border-radius:6px;padding:9px;background:#eaf0fb;color:#2854a0}.bar{flex-wrap:wrap}}
</style></head><body>
<div id="login" class="login"><form id="loginForm" class="login-card"><div class="monogram">M</div><h1>Marketing CRM</h1><p class="muted">Malik Polychem · Secure customer management workspace</p><label>Work email<input id="email" type="email" autocomplete="username" required placeholder="admin@malikpolychem.com"></label><label>Password<input id="password" type="password" autocomplete="current-password" required></label><button type="submit" class="btn">Sign in →</button><p id="loginError" class="error"></p><p class="muted">Customer information is protected by database-level access policies.</p></form></div>
<div id="app" class="layout hide"><aside class="side"><div class="brand">◆ Marketing CRM<small>Malik Polychem</small></div><div id="nav" class="nav"></div><div class="account"><div id="who"></div><button id="logout">Sign out</button></div></aside><div class="work"><div class="top"><h2 id="pageTitle">Dashboard</h2><button id="refresh" class="btn-lite">↻ Refresh</button></div><div class="mobile-nav" id="mobileNav"></div><div class="main" id="main"></div></div></div>
<div class="overlay hide" id="overlay"><form id="recordForm" class="modal"><div class="modal-head"><h3 id="formTitle">Edit</h3><button type="button" class="btn-lite" id="close">×</button></div><div id="fields" class="fields"></div><div class="actions"><button type="button" id="cancel" class="btn-lite">Cancel</button><button class="btn" id="save" type="submit">Save</button></div></form></div><div id="toast" class="toast hide"></div>
<script type="module">
import {createClient} from 'https://esm.sh/@supabase/supabase-js@2.74.0';
const supabase=createClient('https://bdctxguwkctnywuyqcwr.supabase.co','sb_publishable_n_UxO7wNYQZoayp4Uhsmdg_LMMwc2np');
const $=id=>document.getElementById(id);const esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const dt=x=>x?new Date(x).toLocaleDateString('en-IN',{day:'2-digit',month:'short',year:'numeric'}):'—';const num=x=>Number(x||0).toLocaleString('en-IN');let user=null,profile=null,section='dashboard',page=0,search='',items=[],total=0,editor=null,mode='edit',team=[],searchTimer;
const sections=[['dashboard','Dashboard'],['contacts','Contacts'],['companies','Companies'],['leads','Leads'],['followups','Follow-ups'],['calls','Call History'],['quotes','Quotations'],['tenders','Tenders'],['team','Team Access'],['audit','Audit Trail']];
const defs={contacts:{table:'crm_contacts',cols:[['code','ID'],['name','Name'],['company_name_raw','Company'],['phone','Phone'],['status','Status'],['next_followup_at','Follow-up'],['legacy_assigned','Legacy owner']],fields:[['name','Contact Name'],['company_name_raw','Company'],['phone','Mobile'],['email','Email'],['status','Status'],['owner_id','Assigned User','user'],['next_followup_at','Next Follow-up','date'],['next_action','Next Action'],['remarks','Remarks','textarea']],query:['name','company_name_raw','phone','email','code']},companies:{table:'crm_companies',cols:[['code','ID'],['name','Company Name'],['industry','Industry'],['location','City'],['company_type','Type']],fields:[['name','Company Name'],['industry','Industry'],['location','Location'],['company_type','Type']],query:['name','industry','location','code']},leads:{table:'crm_leads',cols:[['code','ID'],['company_name_raw','Company'],['contact_name_raw','Contact'],['equipment','Requirement'],['stage','Stage']],fields:[['company_name_raw','Company'],['contact_name_raw','Contact'],['phone','Phone'],['equipment','Requirement'],['stage','Stage','stage'],['owner_id','Assigned User','user'],['remarks','Remarks','textarea']],query:['code','company_name_raw','contact_name_raw','equipment']},calls:{table:'crm_activities',cols:[['code','Call ID'],['occurred_at','Date'],['outcome','Result'],['notes','Discussion'],['record_type','Type']],fields:[],query:['code','outcome','notes']},quotes:{table:'crm_quotes',cols:[['quote_number','Quote'],['client_raw','Client'],['equipment','Equipment'],['status','Status']],fields:[['quote_number','Quote #'],['client_raw','Client'],['equipment','Equipment'],['status','Status']],query:['quote_number','client_raw','equipment']},tenders:{table:'crm_tenders',cols:[['tender_number','Tender'],['enquiry_number','Enquiry'],['deadline','Deadline'],['status','Status']],fields:[['tender_number','Tender #'],['enquiry_number','Enquiry #'],['deadline','Deadline','date'],['status','Status']],query:['tender_number','enquiry_number']},team:{table:'crm_profiles',cols:[['full_name','Name'],['role','Role'],['active','Active']],fields:[['full_name','Name'],['role','Role','role'],['active','Active','boolean']],query:['full_name','role']},audit:{table:'crm_audit',cols:[['at','When'],['entity','Entity'],['operation','Action'],['entity_id','Record ID']],fields:[],query:['entity','operation']}};
function toast(t){$('toast').textContent=t;$('toast').classList.remove('hide');setTimeout(()=>$('toast').classList.add('hide'),3600)}function err(e){toast('Error: '+(e.message||e))}
function nav(){const visible=sections.filter(([k])=>!['team','audit'].includes(k)||['admin','manager'].includes(profile.role));$('nav').innerHTML=visible.map(([k,v])=>`<button data-section="${k}" class="${k===section?'active':''}">${esc(v)}</button>`).join('');$('mobileNav').innerHTML=visible.map(([k,v])=>`<button data-section="${k}">${esc(v)}</button>`).join('');document.querySelectorAll('[data-section]').forEach(b=>b.onclick=()=>{section=b.dataset.section;page=0;search='';render()});$('who').textContent=(profile.full_name||user.email)+' · '+profile.role}
async function setup(u){const r=await supabase.from('crm_profiles').select('*').eq('user_id',u.id).maybeSingle();if(r.error||!r.data?.active){$('loginError').textContent='CRM access not enabled for this account';await supabase.auth.signOut();return}user=u;profile=r.data;let t=await supabase.from('crm_profiles').select('user_id,full_name,role,active');team=t.data||[];$('login').classList.add('hide');$('app').classList.remove('hide');await render()}
$('loginForm').onsubmit=async e=>{e.preventDefault();$('loginError').textContent='';let r=await supabase.auth.signInWithPassword({email:$('email').value.trim(),password:$('password').value});if(r.error){$('loginError').textContent=r.error.message;return}await setup(r.data.user)};
$('logout').onclick=()=>supabase.auth.signOut();supabase.auth.onAuthStateChange((event)=>{if(event==='SIGNED_OUT'){$('login').classList.remove('hide');$('app').classList.add('hide');user=null;profile=null}});$('refresh').onclick=render;
async function dashboard(){const cn=async name=>{let r=await supabase.from(name).select('*',{head:true,count:'exact'});if(r.error)throw r.error;return r.count||0};const [contacts,companies,leads,calls,quotes,tenders]=await Promise.all(['crm_contacts','crm_companies','crm_leads','crm_activities','crm_quotes','crm_tenders'].map(cn));$('main').innerHTML=`<h1>Welcome to Marketing CRM</h1><p class="muted">Your secure customer and sales workspace</p><div class="metrics">${[['Contacts',contacts],['Companies',companies],['Leads',leads],['Call Records',calls]].map(([name,value])=>`<div class="metric"><small>${name}</small><strong>${num(value)}</strong></div>`).join('')}</div><div class="panel"><h3>Sales & Operations</h3><p>Quotations: <b>${num(quotes)}</b> &nbsp; | &nbsp; Tenders: <b>${num(tenders)}</b></p><div class="notice">Select a section on the left to search customer records or manage follow-ups. Customer records are loaded only after authenticated login.</div></div>`}
function printCell(k,row){let v=row[k];if(v==null||v==='')return '—';if(k==='active')return v?'Yes':'No';if(k.endsWith('_at')||k==='deadline')return esc(dt(v));let text=String(v);return `<span title="${esc(text)}">${esc(text.length>100?text.slice(0,97)+'...':text)}</span>`}
async function list(){const def=defs[section==='followups'?'contacts':section],take=25;let q=supabase.from(def.table).select('*',{count:'exact'});if(section==='followups')q=q.not('next_followup_at','is',null).order('next_followup_at',{ascending:true});else q=q.order(section==='audit'?'at':section==='calls'?'occurred_at':section==='team'?'created_at':['quotes','tenders'].includes(section)?'id':'created_at',{ascending:false});if(search){let clean=search.replace(/[(),%*]/g,' ').trim();if(clean)q=q.or(def.query.map(c=>`${c}.ilike.%${clean}%`).join(','))}const r=await q.range(page*take,(page+1)*take-1);if(r.error)throw r.error;items=r.data||[];total=r.count||0;let editable=def.fields.length&&section!=='followups';$('main').innerHTML=`<h1>${esc(sections.find(x=>x[0]===section)[1])}</h1><p class="muted">Browse and manage authorized CRM records.</p><div class="bar"><input id="find" placeholder="Search records..." value="${esc(search)}"><span>${num(total)} records</span>${editable?'<button class="btn" id="new">+ New</button>':''}</div><div class="box"><div class="overflow"><table><thead><tr>${def.cols.map(([,h])=>`<th>${esc(h)}</th>`).join('')}<th>Actions</th></tr></thead><tbody>${items.map((r,i)=>`<tr>${def.cols.map(([k])=>`<td>${printCell(k,r)}</td>`).join('')}<td>${editable?`<button data-edit="${i}">Edit</button>`:''}${['contacts','followups'].includes(section)?`<button data-call="${i}">Log Call</button>`:''}</td></tr>`).join('')}</tbody></table>${items.length?'':'<p style="padding:25px">No matching records.</p>'}</div><div class="foot"><span class="muted">Page ${page+1}</span><div><button class="btn-lite" id="prev" ${page===0?'disabled':''}>Previous</button><button class="btn-lite" id="next" ${(page+1)*take>=total?'disabled':''}>Next</button></div></div></div>`;if($('new'))$('new').onclick=()=>open(null,'new');$('prev').onclick=()=>{page=Math.max(0,page-1);render()};$('next').onclick=()=>{page++;render()};$('find').oninput=e=>{const v=e.target.value;clearTimeout(searchTimer);searchTimer=setTimeout(()=>{search=v;page=0;render()},550)};document.querySelectorAll('[data-edit]').forEach(b=>b.onclick=()=>open(items[+b.dataset.edit],'edit'));document.querySelectorAll('[data-call]').forEach(b=>b.onclick=()=>open(items[+b.dataset.call],'call'))}
function formElement(f,row){let [k,label,t]=f,v=row?.[k]??'';if(t==='date')v=String(v).slice(0,10);let control;if(t==='textarea')control=`<textarea name="${k}">${esc(v)}</textarea>`;else if(t==='stage')control=`<select name="${k}">${['Open','Contacted by Sales Team','Meeting set','Quotation Sent','Negotiation','Won','Deal Lost','On Hold'].map(x=>`<option ${v===x?'selected':''}>${x}</option>`).join('')}</select>`;else if(t==='role')control=`<select name="${k}">${['caller','sales','manager','admin'].map(x=>`<option ${v===x?'selected':''}>${x}</option>`).join('')}</select>`;else if(t==='boolean')control=`<select name="${k}"><option value="true" ${v===true?'selected':''}>Yes</option><option value="false" ${v===false?'selected':''}>No</option></select>`;else if(t==='user')control=`<select name="${k}"><option value="">Unassigned</option>${team.filter(x=>x.active).map(x=>`<option value="${esc(x.user_id)}" ${v===x.user_id?'selected':''}>${esc(x.full_name||x.user_id)}</option>`).join('')}</select>`;else control=`<input name="${k}" type="${t==='date'?'date':'text'}" value="${esc(v)}">`;return `<label class="${t==='textarea'?'wide':''}">${esc(label)}${control}</label>`}
function open(row,m){editor=row;mode=m;let fs=m==='call'?[['outcome','Call Outcome'],['notes','Discussion','textarea'],['next_action','Next Action'],['next_followup_at','Next Follow-up','date']]:defs[section].fields;$('formTitle').textContent=m==='call'?'Log Customer Call':(m==='new'?'Add':'Edit')+' Record';$('fields').innerHTML=fs.map(f=>formElement(f,m==='call'?{}:row)).join('');$('overlay').classList.remove('hide')};function close(){$('overlay').classList.add('hide')};$('close').onclick=close;$('cancel').onclick=close;
$('recordForm').onsubmit=async e=>{e.preventDefault();$('save').disabled=true;const o=Object.fromEntries([...new FormData(e.target).entries()].map(([k,v])=>[k,v===''?null:v]));try{if(mode==='call'){if(!editor?.id)throw Error('Contact missing');const r=await supabase.from('crm_activities').insert({contact_id:editor.id,actor_id:user.id,outcome:o.outcome,notes:o.notes,next_action:o.next_action,next_followup_at:o.next_followup_at?o.next_followup_at+'T12:00:00+05:30':null,occurred_at:new Date().toISOString(),record_type:'New call'});if(r.error)throw r.error}else{const def=defs[section];for(const [k,,t] of def.fields){if(t==='boolean')o[k]=o[k]==='true';if(t==='date'&&o[k]&&k!=='deadline')o[k]+='T12:00:00+05:30'}if(mode==='new'){if(['contacts','leads'].includes(section)&&!o.owner_id)o.owner_id=user.id;let r=await supabase.from(def.table).insert(o);if(r.error)throw r.error}else{if(section==='team'&&profile.role!=='admin')throw Error('Admin access required');let r=await supabase.from(def.table).update(o).eq(section==='team'?'user_id':'id',section==='team'?editor.user_id:editor.id);if(r.error)throw r.error}}close();toast('Saved successfully');await render()}catch(ex){err(ex)}finally{$('save').disabled=false}};
async function render(){if(!profile)return;nav();$('pageTitle').textContent=sections.find(x=>x[0]===section)?.[1];$('main').innerHTML='<div class="panel">Loading...</div>';try{section==='dashboard'?await dashboard():await list()}catch(e){$('main').innerHTML='<div class="panel"><h3>Unable to load page</h3><p class="error">'+esc(e.message)+'</p></div>'}}
(async()=>{let r=await supabase.auth.getSession();if(r.data?.session)await setup(r.data.session.user)})();
</script></body></html>
